name: Autograding Tests

on:
  push:
  workflow_dispatch:
  repository_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Bronze - File named correctly
        id: b01-file-named-correctly
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bronze - File named correctly
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_b01_file_named_correctly -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Bronze - Welcome message
        id: b02-welcome-message
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bronze - Welcome message
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_b02_welcome_message -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Bronze - Asks for name and age
        id: b03-asks-for-name-and-age
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bronze - Asks for name and age
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_b03_asks_for_name_and_age -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Bronze - Greeting output
        id: b04-greeting-output
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bronze - Greeting output
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_b04_greeting_output -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Bronze - Greeting other values
        id: b05-greeting-other-values
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bronze - Greeting other values
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_b05_greeting_other_values -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Bronze - Name variable value
        id: b06-name-variable-value
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bronze - Name variable value
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_b06_name_variable_value -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Bronze - Age variable value
        id: b07-age-variable-value
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bronze - Age variable value
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_b07_age_variable_value -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Bronze - Age 15 enters 13plus
        id: b08-age-15-enters-13plus
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bronze - Age 15 enters 13plus
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_b08_age_15_enters_13plus -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Bronze - Age 13 boundary
        id: b09-age-13-boundary
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bronze - Age 13 boundary
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_b09_age_13_boundary -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Bronze - Age 12 family
        id: b10-age-12-family
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bronze - Age 12 family
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_b10_age_12_family -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Bronze - Age 5 family
        id: b11-age-5-family
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bronze - Age 5 family
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_b11_age_5_family -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Bronze - Age 70 enters 13plus
        id: b12-age-70-enters-13plus
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bronze - Age 70 enters 13plus
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_b12_age_70_enters_13plus -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Bronze - Output order
        id: b13-output-order
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bronze - Output order
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_b13_output_order -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Bronze - Has comments
        id: b14-has-comments
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Bronze - Has comments
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_b14_has_comments -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Silver - Total cost
        id: s01-total-cost
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Silver - Total cost
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_s01_total_cost -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Silver - Senior and child discount
        id: s02-senior-and-child-discount
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Silver - Senior and child discount
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_s02_senior_and_child_discount -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Silver - Regular and boundaries
        id: s03-regular-and-boundaries
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Silver - Regular and boundaries
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_s03_regular_and_boundaries -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Gold - Rewards member yes
        id: g01-rewards-member-yes
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Gold - Rewards member yes
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_g01_rewards_member_yes -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Gold - Rewards member no and invalid
        id: g02-rewards-member-no-and-invalid
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Gold - Rewards member no and invalid
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_g02_rewards_member_no_and_invalid -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Gold - Group package
        id: g03-group-package
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Gold - Group package
          setup-command: ""
          command: python -m pytest test_unit1_lab.py::test_g03_group_package -q | grep -qE "^[0-9]+ passed"
          timeout: 10
          max-score: 1

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          B01-FILE-NAMED-CORRECTLY_RESULTS: "${{steps.b01-file-named-correctly.outputs.result}}"
          B02-WELCOME-MESSAGE_RESULTS: "${{steps.b02-welcome-message.outputs.result}}"
          B03-ASKS-FOR-NAME-AND-AGE_RESULTS: "${{steps.b03-asks-for-name-and-age.outputs.result}}"
          B04-GREETING-OUTPUT_RESULTS: "${{steps.b04-greeting-output.outputs.result}}"
          B05-GREETING-OTHER-VALUES_RESULTS: "${{steps.b05-greeting-other-values.outputs.result}}"
          B06-NAME-VARIABLE-VALUE_RESULTS: "${{steps.b06-name-variable-value.outputs.result}}"
          B07-AGE-VARIABLE-VALUE_RESULTS: "${{steps.b07-age-variable-value.outputs.result}}"
          B08-AGE-15-ENTERS-13PLUS_RESULTS: "${{steps.b08-age-15-enters-13plus.outputs.result}}"
          B09-AGE-13-BOUNDARY_RESULTS: "${{steps.b09-age-13-boundary.outputs.result}}"
          B10-AGE-12-FAMILY_RESULTS: "${{steps.b10-age-12-family.outputs.result}}"
          B11-AGE-5-FAMILY_RESULTS: "${{steps.b11-age-5-family.outputs.result}}"
          B12-AGE-70-ENTERS-13PLUS_RESULTS: "${{steps.b12-age-70-enters-13plus.outputs.result}}"
          B13-OUTPUT-ORDER_RESULTS: "${{steps.b13-output-order.outputs.result}}"
          B14-HAS-COMMENTS_RESULTS: "${{steps.b14-has-comments.outputs.result}}"
          S01-TOTAL-COST_RESULTS: "${{steps.s01-total-cost.outputs.result}}"
          S02-SENIOR-AND-CHILD-DISCOUNT_RESULTS: "${{steps.s02-senior-and-child-discount.outputs.result}}"
          S03-REGULAR-AND-BOUNDARIES_RESULTS: "${{steps.s03-regular-and-boundaries.outputs.result}}"
          G01-REWARDS-MEMBER-YES_RESULTS: "${{steps.g01-rewards-member-yes.outputs.result}}"
          G02-REWARDS-MEMBER-NO-AND-INVALID_RESULTS: "${{steps.g02-rewards-member-no-and-invalid.outputs.result}}"
          G03-GROUP-PACKAGE_RESULTS: "${{steps.g03-group-package.outputs.result}}"
        with:
          runners: b01-file-named-correctly,b02-welcome-message,b03-asks-for-name-and-age,b04-greeting-output,b05-greeting-other-values,b06-name-variable-value,b07-age-variable-value,b08-age-15-enters-13plus,b09-age-13-boundary,b10-age-12-family,b11-age-5-family,b12-age-70-enters-13plus,b13-output-order,b14-has-comments,s01-total-cost,s02-senior-and-child-discount,s03-regular-and-boundaries,g01-rewards-member-yes,g02-rewards-member-no-and-invalid,g03-group-package
