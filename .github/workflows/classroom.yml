name: GitHub Classroom Autograding

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autograding:
    name: Run lab autograder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out submission
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tiered autograder
        run: python -m pytest -v test_unit1_lab.py
